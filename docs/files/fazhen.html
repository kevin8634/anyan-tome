<!doctype html>
<!-- 暗岩秘典 · 卷〇 第二节：第一个法阵。双击就能打开（需要联网加载 three.js）。 -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>第一个法阵</title>
<style>html,body{margin:0;height:100%;background:#07090a;overflow:hidden}</style>
<script type="importmap">{ "imports": { "three": "https://registry.npmmirror.com/three/0.170.0/files/build/three.module.min.js" } }</script>
</head><body>
<script type="module">
import * as THREE from 'three';

// 1. 舞台：渲染器、场景、相机
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
camera.position.set(0, 6.2, 7.4);
camera.lookAt(0, 0.3, 0);
function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

// 2. 发光材质：叠加混合，越叠越亮
const glow = color => new THREE.MeshBasicMaterial({ color, transparent: true, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false });
const flat = o => { o.rotation.x = -Math.PI / 2; return o; };   // 平放在地上
const ring = (r, w, c = 0xb46cff) => flat(new THREE.Mesh(new THREE.RingGeometry(r - w, r, 128), glow(c)));

// 3. 法阵本体：几道圆环 + 刻度 + 六芒星
const circle = new THREE.Group(); scene.add(circle);
[[3, 0.08], [2.6, 0.04], [1.2, 0.05], [3.12, 0.25, 0x5a2a99], [1.32, 0.18, 0x5a2a99]].forEach(a => circle.add(ring(...a)));
for (let i = 0; i < 48; i++) {
  const a = i / 48 * Math.PI * 2;
  const tick = flat(new THREE.Mesh(new THREE.PlaneGeometry(0.05, i % 4 ? 0.18 : 0.34), glow(0xd7a6ff)));
  tick.rotation.z = -a; tick.position.set(Math.cos(a) * 2.8, 0.01, Math.sin(a) * 2.8); circle.add(tick);
}
function hexagram(r, mat) {
  const g = new THREE.Group();
  for (const off of [0, Math.PI / 3]) {                       // 两个三角形叠成六芒星
    const p = [0, 1, 2, 3].map(k => new THREE.Vector3(Math.cos(off + k * 2 * Math.PI / 3) * r, 0.02, Math.sin(off + k * 2 * Math.PI / 3) * r));
    for (let k = 0; k < 3; k++) {
      const A = p[k], B = p[k + 1], s = flat(new THREE.Mesh(new THREE.PlaneGeometry(A.distanceTo(B), 0.05), mat));
      s.position.copy(A).add(B).multiplyScalar(0.5); s.rotation.z = -Math.atan2(B.z - A.z, B.x - A.x); g.add(s);
    }
  }
  return g;
}
const star = hexagram(2.6, glow(0xe08cff)); circle.add(star);

// 4. 六根符文石柱
const stone = new THREE.MeshBasicMaterial({ color: 0x1b1424 }), rune = glow(0xc78bff);
for (let i = 0; i < 6; i++) {
  const a = i / 6 * Math.PI * 2, pillar = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.16, 0.9, 6), stone);
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.06, 6), rune); cap.position.y = 0.48;
  pillar.add(body, cap); pillar.position.set(Math.cos(a) * 2.2, 0.45, Math.sin(a) * 2.2); circle.add(pillar);
}

// 5. 落雷：每次随机一条折线，从天而降
const boltMat = new THREE.LineBasicMaterial({ color: 0xf2dcff, transparent: true, blending: THREE.AdditiveBlending });
function lightning() {
  const pts = []; let x = 0, z = 0;
  for (let i = 0; i <= 16; i++) { x += (Math.random() - 0.5) * 0.7; z += (Math.random() - 0.5) * 0.7; pts.push(new THREE.Vector3(i === 16 ? 0 : x, 7 - i * 7 / 16, i === 16 ? 0 : z)); }
  return new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), boltMat);
}

// 6. 动起来
let bolt = null, nextBolt = 1;
renderer.setAnimationLoop(ms => {
  const t = ms / 1000;
  circle.rotation.y = t * 0.25; star.rotation.y = -t * 0.6;
  if (t > nextBolt) { if (bolt) scene.remove(bolt); bolt = lightning(); scene.add(bolt); boltMat.opacity = 1; nextBolt = t + 0.8 + Math.random(); }
  boltMat.opacity = Math.max(0, boltMat.opacity - 0.04);
  renderer.render(scene, camera);
});
</script>
</body></html>
